name: Temporary PR 111 formatter

on:
  push:
    branches:
      - claude/resolver-v3-remediation-planning-rlmwbb

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: claude/resolver-v3-remediation-planning-rlmwbb

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format documentation and remove temporary workflow
        run: |
          npx prettier --write \
            ROADMAP.md \
            handoffs/latest-handoff.md \
            reports/RESOLVER_V3_017_018_020_021_022_POST_IMPLEMENTATION_REVIEW.md
          rm .github/workflows/tmp-format-pr111.yml

      - name: Commit formatting result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md handoffs/latest-handoff.md reports/RESOLVER_V3_017_018_020_021_022_POST_IMPLEMENTATION_REVIEW.md .github/workflows/tmp-format-pr111.yml
          git diff --cached --quiet && exit 0
          git commit -m "style(docs): format remediation plan"
          git push origin HEAD:claude/resolver-v3-remediation-planning-rlmwbb
