name: Verify

on:
  pull_request:
  push:
    branches:
      - chore/clean-arch-structure

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # This job only runs typecheck/lint/format/test (npm run verify), none
      # of which invoke the Supabase CLI. `--ignore-scripts` skips the
      # `supabase` package's postinstall, which otherwise downloads a CLI
      # binary from GitHub Releases -- irrelevant to this job's gate. Do not
      # remove this flag to "clean up" the install step without deliberately
      # deciding this job should also fetch the Supabase CLI binary.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify (typecheck + lint + format + test)
        run: npm run verify
